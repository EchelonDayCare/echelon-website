    main {

    /* Breadcrumb */
    .breadcrumb {

    .breadcrumb a {
      text-decoration: none;

    h2 {
      text-align: center;

      font-size: 2.5rem;

    /* Search Bar */
    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }
    .search-container input {
      padding: 10px;
      width: 250px;
      border: 2px solid #2e7dd1;
      border-radius: 6px;
      font-size: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-item:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    /* Hover caption overlay */
    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 1rem;
    }
    .gallery-item:hover .caption-overlay {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .gallery-item img {
        height: 120px;
      }
    }

    /* Modal styles */
    #modal {
      position: fixed;
      display: flex;
      opacity: 0;
      pointer-events: none;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    #modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      user-select: none;
    }

    #modal .caption {
      margin-top: 15px;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Navigation arrows */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
      transition: background 0.3s;
    }
    .nav-arrow:hover {
      background: rgba(0,0,0,0.7);
    }
    #prev-arrow {
      left: 20px;
    }
    #next-arrow {
      right: 20px;
    }

    /* Close button */
    #close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 2.5rem;
      color: white;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
      transition: background 0.3s;
    }
    #close-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    /* Flower animation */
    .flower {
      position: fixed;
      top: -50px;
      font-size: 2rem;
      animation: fall linear infinite;
      z-index: 500; /* behind modal and nav */
      pointer-events: none; /* doesn't block clicks */
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

<script>
  // ---------------------------
  // GALLERY SCRIPT
  // ---------------------------
  const gallery = document.getElementById('gallery');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const modalCaption = document.getElementById('modal-caption');
  const closeBtn = document.getElementById('close-btn');
  const prevArrow = document.getElementById('prev-arrow');
  const nextArrow = document.getElementById('next-arrow');

  // CMS-managed items rendered by the app's Website module. When empty,
  // the gallery is truly empty — no legacy fallback.
  const cmsItems = [{"alt":null,"base_hash":"f53310ec0bfb433a","caption":null,"focal_x":null,"focal_y":null,"height":1018,"media_id":46,"source_filename":"photo3.jpg","variants":[{"filename":"02c3821ff61bafe5-w400.avif","format":"avif","width":400},{"filename":"54debc358a0f6b7f-w400.jpg","format":"jpg","width":400},{"filename":"9963cf20a9e94266-w400.webp","format":"webp","width":400},{"filename":"d0d58840f502c837-w800.avif","format":"avif","width":800},{"filename":"638307e2616cc3f2-w800.jpg","format":"jpg","width":800},{"filename":"94cbaa671eb5228b-w800.webp","format":"webp","width":800},{"filename":"a14981494518aeb8-w1600.avif","format":"avif","width":1600},{"filename":"43a630179ebf3708-w1600.jpg","format":"jpg","width":1600},{"filename":"965d848edbf2799b-w1600.webp","format":"webp","width":1600}],"width":1299},{"alt":null,"base_hash":"bcba8c7a52168f04","caption":null,"focal_x":null,"focal_y":null,"height":391,"media_id":47,"source_filename":"photo1.jpg","variants":[{"filename":"3e915b682b518686-w400.avif","format":"avif","width":400},{"filename":"e5d22558365b1c92-w400.jpg","format":"jpg","width":400},{"filename":"5b19120a85065383-w400.webp","format":"webp","width":400},{"filename":"9984322c1df50e1e-w800.avif","format":"avif","width":800},{"filename":"dc7bc7701043067f-w800.jpg","format":"jpg","width":800},{"filename":"e6b0ac1ad507533c-w800.webp","format":"webp","width":800},{"filename":"768d7db1d3baf932-w1600.avif","format":"avif","width":1600},{"filename":"37a589e4d0aa4646-w1600.jpg","format":"jpg","width":1600},{"filename":"e461de5e19b3967b-w1600.webp","format":"webp","width":1600}],"width":523},{"alt":null,"base_hash":"1c0bce5010829e29","caption":null,"focal_x":null,"focal_y":null,"height":391,"media_id":48,"source_filename":"photo2.jpg","variants":[{"filename":"e7c48dc54d211fc2-w400.avif","format":"avif","width":400},{"filename":"ad7bfd1067f9b0e2-w400.jpg","format":"jpg","width":400},{"filename":"74480198bab11ccd-w400.webp","format":"webp","width":400},{"filename":"5d9468a405062cd2-w800.avif","format":"avif","width":800},{"filename":"bfec0db6f55f0360-w800.jpg","format":"jpg","width":800},{"filename":"2e57e1fded51402a-w800.webp","format":"webp","width":800},{"filename":"6fd28d7456b362f2-w1600.avif","format":"avif","width":1600},{"filename":"e4c6539c0974c210-w1600.jpg","format":"jpg","width":1600},{"filename":"bc3b83bdbe4c4e3d-w1600.webp","format":"webp","width":1600}],"width":523}];

  // Generic warm captions used when a CMS item doesn't carry its own.
  const captionPool = ["Hands-on learning","Outdoor play","Story time","Creative play","Snack time","Group activities","Arts \u0026 crafts","Music \u0026 movement","Exploring nature","Building together","Imagination at work","Quiet learning corner"];
  const captionFor = i => captionPool[(i - 1) % captionPool.length];

  // Build entries: { avif, webp, jpg, caption, alt }
  const entries = [];
  for (const it of cmsItems) {
    const variantOf = (fmt, w) => {
      const v = (it.variants || []).find(v => v.format === fmt && v.width === w);
      return v ? ("../assets/img/gallery/" + v.filename) : null;
    };
    const pick = (fmt) => variantOf(fmt, 800) || variantOf(fmt, 1600) || variantOf(fmt, 400);
    const cap = it.caption || captionFor(entries.length + 1);
    const alt = it.alt || ("Echelon Day Care moment: " + cap);
    entries.push({
      avif: pick("avif"),
      webp: pick("webp"),
      jpg: pick("jpg"),
      caption: cap,
      alt: alt,
    });
  }

  let currentIndex = 0;
  const totalImages = entries.length;

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const item = document.createElement('div');
    item.className = 'gallery-item';

    // <picture> serves AVIF (smallest), then WebP, then JPG fallback.
    const pic = document.createElement('picture');
    if (e.avif) {
      const avifSrc = document.createElement('source');
      avifSrc.srcset = e.avif;
      avifSrc.type = "image/avif";
      pic.appendChild(avifSrc);
    }
    if (e.webp) {
      const source = document.createElement('source');
      source.srcset = e.webp;
      source.type = "image/webp";
      pic.appendChild(source);
    }
    const img = document.createElement('img');
    img.src = e.jpg;
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = e.alt;
    img.dataset.index = i;
    pic.appendChild(img);

    const overlay = document.createElement('div');
    overlay.className = 'caption-overlay';
    overlay.textContent = e.caption;

    item.appendChild(pic);
    item.appendChild(overlay);
    gallery.appendChild(item);
  }

  function openModal(index) {
    currentIndex = index;
    modal.classList.add('active');
    updateModal();
    modal.focus();
  }

  function updateModal() {
    const e = entries[currentIndex];
    if (!e) return;
    modalImg.src = e.jpg;
    modalImg.alt = e.alt;
    modalCaption.textContent = e.caption;
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % totalImages;
    updateModal();
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + totalImages) % totalImages;
    updateModal();
  }

  gallery.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') {
      const idx = parseInt(e.target.dataset.index, 10);
      openModal(idx);
    }
  });

  closeBtn.addEventListener('click', closeModal);
  nextArrow.addEventListener('click', showNext);
  prevArrow.addEventListener('click', showPrev);

  document.addEventListener('keydown', (e) => {
    if (!modal.classList.contains('active')) return;
    if (e.key === 'ArrowRight') showNext();
    else if (e.key === 'ArrowLeft') showPrev();
    else if (e.key === 'Escape') closeModal();
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // ---------------------------
  // FALLING FLOWERS SCRIPT
  // ---------------------------
  const flowers = ["🌸","🌼","🌻","🌺","🌷","💐","🌹"];

  function createFlower() {
    const flower = document.createElement("div");
    flower.classList.add("flower");
    flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    
    flower.style.left = Math.random() * 100 + "vw";
    const duration = Math.random() * 3 + 3; // 3 to 6 seconds
    flower.style.animationDuration = duration + "s";
    
    document.body.appendChild(flower);
    
    setTimeout(() => flower.remove(), duration * 1000);
  }

  setInterval(createFlower, 300);
</script>
