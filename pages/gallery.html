    .gallery {

      background: white;
      border-radius: 8px;

      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-item:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    /* Hover caption overlay */
    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 1rem;
    }
    .gallery-item:hover .caption-overlay {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .gallery-item img {
        height: 120px;
      }
    }

    /* Modal styles */
    #modal {
      position: fixed;
      display: flex;
      opacity: 0;
      pointer-events: none;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    #modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      user-select: none;
    }

    #modal .caption {
      margin-top: 15px;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Navigation arrows */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
      transition: background 0.3s;
    }
    .nav-arrow:hover {
      background: rgba(0,0,0,0.7);
    }
    #prev-arrow {
      left: 20px;
    }
    #next-arrow {
      right: 20px;
    }

    /* Close button */
    #close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 2.5rem;
      color: white;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
      transition: background 0.3s;
    }
    #close-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    /* Flower animation */
    .flower {
      position: fixed;
      top: -50px;
      font-size: 2rem;
      animation: fall linear infinite;
      z-index: 500; /* behind modal and nav */
      pointer-events: none; /* doesn't block clicks */
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

<script>
  // ---------------------------
  // GALLERY SCRIPT
  // ---------------------------
  const gallery = document.getElementById('gallery');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const modalCaption = document.getElementById('modal-caption');
  const closeBtn = document.getElementById('close-btn');
  const prevArrow = document.getElementById('prev-arrow');
  const nextArrow = document.getElementById('next-arrow');

  // CMS-managed items rendered by the app's Website module. When empty,
  // fall back to the legacy 50-photo pattern under assets/img/gallery/.
  const cmsItems = {{ gallery.get("items", []) | tojson }};

  // Generic but warm captions cycled across legacy photos so each opens with
  // something meaningful instead of "Photo 17". Ignored for CMS items when
  // they carry their own caption.
  const captionPool = {{ gallery.get("caption_pool", ["Photo"]) | tojson }};
  const captionFor = i => captionPool[(i - 1) % captionPool.length];

  // Build entries: { avif, webp, jpg, caption, alt }
  const entries = [];
  if (cmsItems.length > 0) {
    for (const it of cmsItems) {
      const variantOf = (fmt, w) => {
        const v = (it.variants || []).find(v => v.format === fmt && v.width === w);
        return v ? ("../assets/img/gallery/" + v.filename) : null;
      };
      const pick = (fmt) => variantOf(fmt, 800) || variantOf(fmt, 1600) || variantOf(fmt, 400);
      const cap = it.caption || captionFor(entries.length + 1);
      const alt = it.alt || ("Echelon Day Care moment: " + cap);
      entries.push({
        avif: pick("avif"),
        webp: pick("webp"),
        jpg: pick("jpg"),
        caption: cap,
        alt: alt,
      });
    }
  } else {
    const totalImages = {{ gallery.get("total_images", 50) | tojson }};
    for (let i = 1; i <= totalImages; i++) {
      const cap = captionFor(i);
      entries.push({
        avif: "../assets/img/gallery/Photo (" + i + ").avif",
        webp: "../assets/img/gallery/Photo (" + i + ").webp",
        jpg:  "../assets/img/gallery/Photo (" + i + ").jpg",
        caption: cap,
        alt: "Echelon Day Care moment: " + cap,
      });
    }
  }

  let currentIndex = 0;
  const totalImages = entries.length;

  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const item = document.createElement('div');
    item.className = 'gallery-item';

    // <picture> serves AVIF (smallest), then WebP, then JPG fallback.
    const pic = document.createElement('picture');
    if (e.avif) {
      const avifSrc = document.createElement('source');
      avifSrc.srcset = e.avif;
      avifSrc.type = "image/avif";
      pic.appendChild(avifSrc);
    }
    if (e.webp) {
      const source = document.createElement('source');
      source.srcset = e.webp;
      source.type = "image/webp";
      pic.appendChild(source);
    }
    const img = document.createElement('img');
    img.src = e.jpg;
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = e.alt;
    img.dataset.index = i;
    pic.appendChild(img);

    const overlay = document.createElement('div');
    overlay.className = 'caption-overlay';
    overlay.textContent = e.caption;

    item.appendChild(pic);
    item.appendChild(overlay);
    gallery.appendChild(item);
  }

  function openModal(index) {
    currentIndex = index;
    modal.classList.add('active');
    updateModal();
    modal.focus();
  }

  function updateModal() {
    const e = entries[currentIndex];
    if (!e) return;
    modalImg.src = e.jpg;
    modalImg.alt = e.alt;
    modalCaption.textContent = e.caption;
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % totalImages;
    updateModal();
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + totalImages) % totalImages;
    updateModal();
  }

  gallery.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') {
      const idx = parseInt(e.target.dataset.index, 10);
      openModal(idx);
    }
  });

  closeBtn.addEventListener('click', closeModal);
  nextArrow.addEventListener('click', showNext);
  prevArrow.addEventListener('click', showPrev);

  document.addEventListener('keydown', (e) => {
    if (!modal.classList.contains('active')) return;
    if (e.key === 'ArrowRight') showNext();
    else if (e.key === 'ArrowLeft') showPrev();
    else if (e.key === 'Escape') closeModal();
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // ---------------------------
  // FALLING FLOWERS SCRIPT
  // ---------------------------
  const flowers = ["🌸","🌼","🌻","🌺","🌷","💐","🌹"];

  function createFlower() {
    const flower = document.createElement("div");
    flower.classList.add("flower");
    flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    
    flower.style.left = Math.random() * 100 + "vw";
    const duration = Math.random() * 3 + 3; // 3 to 6 seconds
    flower.style.animationDuration = duration + "s";
    
    document.body.appendChild(flower);
    
    setTimeout(() => flower.remove(), duration * 1000);
  }

  setInterval(createFlower, 300);
</script>
