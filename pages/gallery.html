  <style>
@media (max-width: 768px) {
}

    main {
      max-width: 1200px;
      margin: 30px auto 60px auto;
      padding: 0 15px;
    }

    /* Breadcrumb */
    .breadcrumb {
      font-size: 0.9rem;
      margin: 10px 15px;
      color: #666;
    }
    .breadcrumb a {
      text-decoration: none;
      color: #2e7dd1;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.5rem;
      color: #1d5fa3;
    }

    /* Search Bar */
    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }
    .search-container input {
      padding: 10px;
      width: 250px;
      border: 2px solid #2e7dd1;
      border-radius: 6px;
      font-size: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery-item:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    /* Hover caption overlay */
    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 1rem;
    }
    .gallery-item:hover .caption-overlay {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .gallery-item img {
        height: 120px;
      }
    }

    /* Modal styles */
    #modal {
      position: fixed;
      display: flex;
      opacity: 0;
      pointer-events: none;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    #modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      user-select: none;
    }

    #modal .caption {
      margin-top: 15px;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Navigation arrows */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
      transition: background 0.3s;
    }
    .nav-arrow:hover {
      background: rgba(0,0,0,0.7);
    }
    #prev-arrow {
      left: 20px;
    }
    #next-arrow {
      right: 20px;
    }

    /* Close button */
    #close-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 2.5rem;
      color: white;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      line-height: 40px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
      transition: background 0.3s;
    }
    #close-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    /* Flower animation */
    .flower {
      position: fixed;
      top: -50px;
      font-size: 2rem;
      animation: fall linear infinite;
      z-index: 500; /* behind modal and nav */
      pointer-events: none; /* doesn't block clicks */
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<main id="main-content">
  <h2>Photo Gallery</h2>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" id="search" placeholder="Search photos..." />
  </div>

  <div class="gallery" id="gallery">
    <!-- Gallery items inserted by JS -->
  </div>
</main>

<!-- Modal Structure -->
<div id="modal" tabindex="-1" aria-modal="true" role="dialog">
  <div id="close-btn" title="Close">&times;</div>
  <div id="prev-arrow" class="nav-arrow" title="Previous">&#8592;</div>
  <img id="modal-img" src="" alt="" />
  <div class="caption" id="modal-caption"></div>
  <div id="next-arrow" class="nav-arrow" title="Next">&#8594;</div>
</div>

<script>
  // ---------------------------
  // GALLERY SCRIPT
  // ---------------------------
  const gallery = document.getElementById('gallery');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const modalCaption = document.getElementById('modal-caption');
  const closeBtn = document.getElementById('close-btn');
  const prevArrow = document.getElementById('prev-arrow');
  const nextArrow = document.getElementById('next-arrow');

  const totalImages = 50;
  let currentIndex = 0;

  // Generic but warm captions cycled across all 50 photos so each opens with
  // something meaningful instead of "Photo 17". Replace this list with real
  // captions when you have them.
  const captionPool = [
    "Hands-on learning",
    "Outdoor play",
    "Story time",
    "Creative play",
    "Snack time",
    "Group activities",
    "Arts & crafts",
    "Music & movement",
    "Exploring nature",
    "Building together",
    "Imagination at work",
    "Quiet learning corner"
  ];
  const captionFor = i => captionPool[(i - 1) % captionPool.length];

  for (let i = 1; i <= totalImages; i++) {
    const item = document.createElement('div');
    item.className = 'gallery-item';

    const cap = captionFor(i);
    const img = document.createElement('img');
    img.src = "../assets/img/gallery/Photo (" + i + ").jpg";
    img.alt = "Echelon Day Care moment: " + cap;
    img.dataset.index = i - 1;

    const overlay = document.createElement('div');
    overlay.className = 'caption-overlay';
    overlay.textContent = cap;

    item.appendChild(img);
    item.appendChild(overlay);
    gallery.appendChild(item);
  }

  function openModal(index) {
    currentIndex = index;
    modal.classList.add('active');
    updateModal();
    modal.focus();
  }

  function updateModal() {
    const imgNum = currentIndex + 1;
    const cap = captionFor(imgNum);
    modalImg.src = "../assets/img/gallery/Photo (" + imgNum + ").jpg";
    modalImg.alt = "Echelon Day Care moment: " + cap;
    modalCaption.textContent = cap;
  }

  function closeModal() {
    modal.classList.remove('active');
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % totalImages;
    updateModal();
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + totalImages) % totalImages;
    updateModal();
  }

  gallery.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') {
      const idx = parseInt(e.target.dataset.index, 10);
      openModal(idx);
    }
  });

  closeBtn.addEventListener('click', closeModal);
  nextArrow.addEventListener('click', showNext);
  prevArrow.addEventListener('click', showPrev);

  document.addEventListener('keydown', (e) => {
    if (!modal.classList.contains('active')) return;
    if (e.key === 'ArrowRight') showNext();
    else if (e.key === 'ArrowLeft') showPrev();
    else if (e.key === 'Escape') closeModal();
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // ---------------------------
  // FALLING FLOWERS SCRIPT
  // ---------------------------
  const flowers = ["🌸","🌼","🌻","🌺","🌷","💐","🌹"];

  function createFlower() {
    const flower = document.createElement("div");
    flower.classList.add("flower");
    flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    
    flower.style.left = Math.random() * 100 + "vw";
    const duration = Math.random() * 3 + 3; // 3 to 6 seconds
    flower.style.animationDuration = duration + "s";
    
    document.body.appendChild(flower);
    
    setTimeout(() => flower.remove(), duration * 1000);
  }

  setInterval(createFlower, 300);
</script>

</script>
