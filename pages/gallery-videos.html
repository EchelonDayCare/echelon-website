main {
      max-width: 1100px;

    .video-wrap {
      position: relative;

    }

    .video-wrap video {
      width: 100%;
      height: auto;
      display: block;
    }

    .tour-intro {
      max-width: 800px;

      text-align: center;
      color: var(--c-muted, #5a6c80);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .now-playing {
      max-width: 900px;
      margin: 14px auto 6px;
      text-align: center;
    }

    .now-playing h3 {
      margin: 0 0 4px;
      color: #1d5fa3;
      font-size: 1.25rem;
    }

    .now-playing p {
      margin: 0;
      color: var(--c-muted, #5a6c80);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .playlist {
      max-width: 1100px;
      margin: 22px auto 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      padding: 0;
      list-style: none;
    }

    .playlist button {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      padding: 6px;
      border: 2px solid transparent;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease-out, border-color 0.15s ease-out, box-shadow 0.15s ease-out;
      text-align: left;
      font: inherit;
    }

    .playlist button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .playlist button.is-active {
      border-color: #1d5fa3;
      box-shadow: 0 4px 12px rgba(29,95,163,0.28);
    }

    .playlist .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #0f172a center/cover no-repeat;
      border-radius: 6px;
      overflow: hidden;
    }

    .playlist .thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    .playlist .play-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.15s ease-out;
    }

    .playlist button:hover .play-badge {
      transform: translate(-50%, -50%) scale(1.06);
    }

    .playlist .play-badge svg {
      width: 20px;
      height: 20px;
      color: #1d5fa3;
    }

    .playlist .video-title {
      font-weight: 600;
      color: #1d3557;
      font-size: 0.95rem;
      line-height: 1.3;
    }

</style>
